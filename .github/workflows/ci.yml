name: biteflow-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Locale key parity
        run: python -c "import json,sys; ks=[set(json.load(open(f'locales/{l}.json',encoding='utf-8'))) for l in ('en','es','hi')]; assert ks[0]==ks[1]==ks[2], 'locale keys diverged'; print('locales OK:', len(ks[0]), 'keys')"
      - name: Run tests
        run: python -m pytest tests/ -q
