# Render.com deployment (low-cost path).
# 1. Push this repo to GitHub.
# 2. In Render: New → Blueprint → point at this repo.
# 3. Add a PostgreSQL database (Render Postgres free tier works for a pilot).
# 4. Set the env vars below (secret values via the Render dashboard, NOT in
#    this file).
services:
  - type: web
    name: biteflow
    runtime: python
    plan: free                      # upgrade to starter ($7/mo) for 24/7 uptime
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biteflow-db
          property: connectionString
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: DEFAULT_LANGUAGE
        value: en

databases:
  - name: biteflow-db
    plan: free
    postgresMajorVersion: "16"
